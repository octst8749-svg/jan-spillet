  function drawFace(img, emoji, x, y, size, cut) {
    if (img && cut) {
      const k = size / Math.max(img.width, img.height);
      ctx.drawImage(img, x - img.width * k / 2, y - img.height * k / 2, img.width * k, img.height * k);
    } else if (img) {
      ctx.save(); ctx.beginPath(); ctx.arc(x, y, size / 2, 0, 7); ctx.clip();
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, x - size / 2, y - size / 2, size, size);
      ctx.restore();
      ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, size / 2, 0, 7); ctx.stroke();
    } else {
      ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(emoji, x, y + size * .05);
    }
  }

  // ---------- Spil ----------
  let running = false, score, lives, speed, t, player, coins, foes, naevn, popups, lastNaevn, clouds, target, shake, flash;
  const keys = {};

  function reset() {
    score = 0; lives = 3; speed = 3; t = 0; shake = 0; flash = 0;
    player = { x: W / 2, y: H - 110, r: 30, inv: 0 };
    target = { x: W / 2, y: H - 110 };
    coins = []; foes = []; naevn = []; popups = []; lastNaevn = 0;
    clouds = Array.from({ length: 8 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 30 + Math.random() * 50 }));
    updateHud();
  }
  function updateHud() {
    $('score').textContent = '💰 ' + score;
    $('lives').textContent = '❤️'.repeat(Math.max(lives, 0)) + '🖤'.repeat(Math.max(3 - lives, 0));
    $('best').textContent = 'Rekord ' + best;
  }
  function spawn() {
    if (Math.random() < .035 + t / 60000) coins.push({ x: 30 + Math.random() * (W - 60), y: -30, r: 20, spin: Math.random() * 6 });
    if (Math.random() < .012 + t / 120000) foes.push({ x: 40 + Math.random() * (W - 80), y: -50, r: 32, vx: (Math.random() - .5) * 1.5, phase: Math.random() * 6 });
  }
  function spawnNaevn() {
    if (naevn.length === 0 && t - lastNaevn > 420 && Math.random() < .006) {
      naevn.push({ x: 60 + Math.random() * (W - 120), y: -60, r: 42, tilt: (Math.random() - .5) * .2 });
      lastNaevn = t;
    }
  }
  function playBad() {
    const a = audio(); if (!a) return;
    [196, 165, 131].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain(), st = a.currentTime + i * .16;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.25, st); g.gain.exponentialRampToValueAtTime(.001, st + .22);
      o.connect(g); g.connect(a.destination); o.start(st); o.stop(st + .22);
    });
  }
  let dying = null;
  function end(f) {
    running = false;
    if (score > best) { best = score; try { localStorage.setItem('pf_best', best); } catch (e) {} }
    updateHud();
    dying = { t: 0, x: f ? f.x : W / 2, y: f ? f.y : H / 2 };
  }
  function showMenu() {
    dying = null;
    menu.classList.remove('hidden');
    const h = menu.querySelector('h1'); h.textContent = '💥 Game over – ' + score + ' point'; h.classList.remove('hidden');
    $('start').textContent = 'Spil igen';
  }
  function step() {
    t++;
    speed = 3 + Math.min(t / 600, 5);
    // styring
    const k = 7;
    if (keys.ArrowLeft || keys.a) target.x -= k;
    if (keys.ArrowRight || keys.d) target.x += k;
    if (keys.ArrowUp || keys.w) target.y -= k;
    if (keys.ArrowDown || keys.s) target.y += k;
    target.x = Math.max(player.r, Math.min(W - player.r, target.x));
    target.y = Math.max(160, Math.min(H - player.r, target.y));
    player.x += (target.x - player.x) * .22;
    player.y += (target.y - player.y) * .22;
    if (player.inv > 0) player.inv--;
    spawn(); spawnNaevn();
    clouds.forEach(c => { c.y += speed * .6; if (c.y > H + 60) { c.y = -60; c.x = Math.random() * W; } });
    coins.forEach(c => { c.y += speed; c.spin += .08; });
    foes.forEach(f => {
      f.y += speed * .9 + 0.8; f.phase += .05;

    });

    naevn = naevn.filter(n => {

        const lost = Math.ceil(score / 2);
        score -= lost; shake = 14; playBad(); updateHud();
        popups.push({ x: n.x, y: n.y, text: '-' + lost + ' 💸', life: 60 });
        return false;
      }
      return n.y < H + 70;
    });
    popups.forEach(p => { p.y -= 1.2; p.life--; });
    popups = popups.filter(p => p.life > 0);
    coins = coins.filter(c => {
      if (Math.hypot(c.x - player.x, c.y - player.y) < c.r + player.r - 6) { score += 10; playCoin(); updateHud(); return false; }
      return c.y < H + 40;
    });
    foes = foes.filter(f => {
      if (player.inv === 0 && Math.hypot(f.x - player.x, f.y - player.y) < f.r + player.r - 10) {
        lives--; player.inv = 90; shake = 18; flash = 12; playHit(); updateHud();
        if (lives <= 0) end(f);
        return false;
      }
      return f.y < H + 60;
    });
  }
  function draw() {
    ctx.save();
    if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake--; }
    ctx.clearRect(-20, -20, W + 40, H + 40);
    if (bgImg) { const k = Math.max(W / bgImg.width, H / bgImg.height), dw = bgImg.width * k, dh = bgImg.height * k; ctx.drawImage(bgImg, (W - dw) / 2, H - dh, dw, dh); }
    else { ctx.fillStyle = '#2a6fd0'; ctx.fillRect(0, 0, W, H); }
    // hastighedsstreger
    ctx.strokeStyle = '#ffffff30'; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const x = (i * 97) % W, y = ((t * speed * 2 + i * 131) % (H + 80)) - 40;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 30); ctx.stroke();
    }
    coins.forEach(c => {
      if (bagImg) {
        const k = (c.r * 2.6) / Math.max(bagImg.width, bagImg.height);
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.sin(c.spin) * 0.25);
        ctx.drawImage(bagImg, -bagImg.width * k / 2, -bagImg.height * k / 2, bagImg.width * k, bagImg.height * k);
        ctx.restore();
      } else { ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.fill(); }
    });
    if (naevnImg) naevn.forEach(n => {
      const k = (n.r * 2.6) / naevnImg.width;
      ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(n.tilt);
      ctx.drawImage(naevnImg, -naevnImg.width * k / 2, -naevnImg.height * k / 2, naevnImg.width * k, naevnImg.height * k);
      ctx.restore();
    });
    foes.forEach(f => drawFace(foeImg, '👹', f.x, f.y, f.r * 2.3, foeCut));
    if (player.inv === 0 || Math.floor(t / 4) % 2 === 0) {
      ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(player.x, player.y + 48, 26, 8, 0, 0, 7); ctx.fill();
      drawFace(meImg, '😎', player.x, player.y + Math.sin(t / 10) * 3, player.r * 2.6, true);
    }
    ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    popups.forEach(p => { ctx.globalAlpha = Math.min(1, p.life / 25); ctx.lineWidth = 4; ctx.strokeStyle = '#000a'; ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = '#ff5a5a'; ctx.fillText(p.text, p.x, p.y); });
    ctx.globalAlpha = 1;
    ctx.restore();
    if (dying) {
      const t = dying.t, p = Math.min(1, t / 55), e = 1 - Math.pow(1 - p, 3);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.55 * e) + ')'; ctx.fillRect(0, 0, W, H);
      const size = 74 + (Math.max(W, H) * 1.25 - 74) * e + (p >= 1 ? Math.sin(t * 0.35) * 14 : 0);
      const cx = dying.x + (W / 2 - dying.x) * e, cy = dying.y + (H * 0.48 - dying.y) * e;
      ctx.save();
      ctx.translate(cx + (p >= 1 ? Math.sin(t * 1.7) * 6 : 0), cy);
      ctx.rotate(Math.sin(t * 0.28) * 0.16 * e);
      drawFace(foeImg, '👹', 0, 0, size, foeCut);
      ctx.restore();
      if (t > 45) {
        ctx.save(); ctx.globalAlpha = Math.min(1, (t - 45) / 15);
        ctx.font = 'bold 54px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.translate(W / 2, H * 0.14); ctx.rotate(-0.08 + Math.sin(t * 0.3) * 0.04);
        ctx.lineWidth = 9; ctx.strokeStyle = '#000'; ctx.strokeText('FANGET!', 0, 0);
        ctx.fillStyle = '#ffd23f'; ctx.fillText('FANGET!', 0, 0);
        ctx.restore();
      }
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,0,0,' + flash / 30 + ')'; ctx.fillRect(0, 0, W, H); flash--; }
  }
  function loop() {
    if (running) step();
    draw();
    if (dying && ++dying.t > 130) showMenu();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  function setTarget(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    target.x = (clientX - r.left) / r.width * W;
    target.y = (clientY - r.top) / r.height * H - 40; // lidt over fingeren
  }
  canvas.addEventListener('pointerdown', e => { if (target) setTarget(e.clientX, e.clientY); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (running && e.buttons !== 0 || e.pointerType === 'touch') setTarget(e.clientX, e.clientY); else if (running && e.pointerType === 'mouse') setTarget(e.clientX, e.clientY); });
  addEventListener('keydown', e => { keys[e.key] = true; });
  addEventListener('keyup', e => { keys[e.key] = false; });

  $('start').addEventListener('click', () => {
    audio(); loadDefaultHit();
    reset(); running = true;
    menu.classList.add('hidden');
    menu.querySelector('h1').classList.add('hidden');
  });

  addEventListener('resize', fit); fit();
  reset(); draw(); loop();
})();
</script>
</body>
